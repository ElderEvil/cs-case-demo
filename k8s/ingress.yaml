apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cs-case-demo
  namespace: cs-case-demo
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: cs-case-demo.evillab.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cs-case-demo
                port:
                  number: 80
  tls:
    - hosts:
        - cs-case-demo.evillab.tech
      secretName: cs-case-demo-tls
